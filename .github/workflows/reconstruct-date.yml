name: Document reconstructed project date
on:
  push:
    branches: [main]
    paths: [.github/workflows/reconstruct-date.yml]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record labeled historical snapshot
        env:
          GIT_AUTHOR_NAME: Djag12
          GIT_AUTHOR_EMAIL: 132848963+Djag12@users.noreply.github.com
          GIT_COMMITTER_NAME: Djag12
          GIT_COMMITTER_EMAIL: 132848963+Djag12@users.noreply.github.com
          GIT_AUTHOR_DATE: "2025-06-01T12:00:00Z"
          GIT_COMMITTER_DATE: "2025-06-01T12:00:00Z"
          RECONSTRUCTED_README: "# MarketFlow\n\n**First published on my previous account (from memory):** June 2025  \n**Republished under Djag12:** November 6, 2026\n\nA crossed quote shows up when the best bid meets or exceeds the best ask. MarketFlow follows those prices as updates arrive and flags crossed quotes and stale messages. One writer updates each book. A reader can fetch both quantities at a given price with one atomic load.\n\n## Try it\n\nFrom Linux or Ubuntu in WSL, install GNU Make and a C++17 compiler, then run `make test`. For the longer replay, run `make benchmark`. Both commands print JSON.\n\n## What the replay showed\n\nThe balanced workload touched all 25,000 price levels across 100 symbols. The recorded run processed 100 million synthetic updates at 26.97 million updates per second. Its internal alert latency at the 99th percentile was 35.2 microseconds across 705 sampled alerts. Network transport falls outside the timer. The full run is in `results/marketflow_balanced.json`.\n\nDeveloped with AI assistance.\n\n## Reconstructed history\n\nThis snapshot uses 2025-06-01 as its author and committer date based on my recollection of the original project. Only the month is remembered; the first day is an approximate placeholder. The original Git history was unavailable. This reconstruction was created on November 14, 2026, and does not recover the original individual commits.\n"
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('README.md').write_text(os.environ['RECONSTRUCTED_README'])
          PY
          git rm .github/workflows/reconstruct-date.yml
          git add README.md
          git commit -m "Reconstructed historical snapshot dated 2025-06-01; created November 14, 2026"
          git push origin HEAD:main
